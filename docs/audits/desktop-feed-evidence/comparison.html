<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myckeo · comparación del feed de escritorio</title><style>body{font:16px system-ui;margin:24px;color:#172033;background:#f8fafc}h1{font-size:24px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white;cursor:pointer}button[aria-pressed=true]{background:#e0f2fe}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin:8px 0}img{width:100%;border:1px solid #e2e8f0;border-radius:8px}a{color:#075985}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>Myckeo · una principal estable y una lateral comercial</h1><p>Prototipo local sobre 058d133. Datos y arte sintéticos idénticos en ambas capturas. Cabecera 215 → 133 px; móvil sin cambios.</p><nav id="width"></nav><nav id="position"></nav><main><figure><figcaption>Antes</figcaption><a id="before-link"><img id="before" alt="Composición anterior"></a></figure><figure><figcaption>Prototipo</figcaption><a id="after-link"><img id="after" alt="Composición propuesta"></a></figure></main><script>let width=1440,position='top';function paint(){for(const phase of ['before','after']){const src=`${phase}-${width}-${position}.png`;document.getElementById(phase).src=src;document.getElementById(phase+'-link').href=src;}document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===(b.dataset.group==='width'?String(width):position))));}for(const [group,values] of [['width',[1440,1920,390]],['position',['top','scroll']]])for(const v of values){const b=document.createElement('button');b.dataset.group=group;b.dataset.value=v;b.textContent=group==='width'?v+' px':v==='top'?'Primera pantalla':'Después de 950 px de scroll';b.onclick=()=>{if(group==='width')width=v;else position=v;paint()};document.getElementById(group).append(b)}paint();</script></html>

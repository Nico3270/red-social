<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myckeo · principal centrada</title><style>body{margin:20px;font:15px system-ui;color:#172033;background:#f8fafc}h1{font-size:24px;margin-bottom:8px}p{max-width:1000px;line-height:1.5}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{padding:10px 14px;min-height:44px;border:1px solid #cbd5e1;border-radius:10px;background:white;cursor:pointer}button[aria-pressed=true]{background:#e0f2fe;color:#075985;border-color:#7dd3fc}button:disabled{opacity:.4;cursor:default}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin:12px 0}img{display:block;width:100%;border:1px solid #e2e8f0;border-radius:8px}a{color:#075985}#note{color:#475569}@media(max-width:750px){main{grid-template-columns:1fr}}</style><h1>Myckeo · publicaciones en el centro visual</h1><p>Referencia publicada 8ce16bc y propuesta local, con el mismo inventario fijo y las mismas fotografías públicas cacheadas. El comparador no modifica el orden de llegada, los vistos ni datos de producción. Pulsa una captura para verla a tamaño completo.</p><nav id="widths" aria-label="Ancho de pantalla"></nav><nav id="scenarios" aria-label="Inventario"></nav><nav id="positions" aria-label="Posición"></nav><p id="note"></p><main><figure><figcaption>Referencia 8ce16bc · lote fijo</figcaption><a id="beforeLink" target="_blank"><img id="before" alt="Composición publicada de referencia"></a></figure><figure><figcaption>Propuesta · principal centrada</figcaption><a id="afterLink" target="_blank"><img id="after" alt="Propuesta de navegación izquierda y principal centrada"></a></figure></main><script>let width=1440,scenario='balanced',position='top';const choices={widths:[[1440,'1440 px'],[1920,'1920 px'],[1439,'1439 px · límite'],[390,'390 px · móvil']],scenarios:[['balanced','Mixto · 33'],['sparse','Escaso · 2'],['commerce','Solo comercial · 23'],['social','Solo social · 10'],['reviews','Reseñas vinculadas · 5']],positions:[['top','Inicio'],['scroll','Desplazamiento (hasta 950 px)']]};function paint(){if(width<1440)scenario='balanced';for(const phase of ['before','after']){const file=phase+'-'+(scenario==='balanced'?'':scenario+'-')+width+'-'+position+'.png';document.getElementById(phase).src=file;document.getElementById(phase+'Link').href=file;}document.querySelectorAll('button').forEach(b=>{const current=b.dataset.group==='widths'?String(width):b.dataset.group==='scenarios'?scenario:position;b.setAttribute('aria-pressed',String(b.dataset.value===current));b.disabled=b.dataset.group==='scenarios'&&width<1440&&b.dataset.value!=='balanced'});document.getElementById('note').textContent=width>=1440?'Principal: 680 px. Su centro coincide con el viewport ('+width/2+' px). La navegación lateral fluye con el documento; la fila superior de 72 px permanece fija.':'Sin composición nueva: se conserva la distribución publicada. Los casos de inventario se comparan en 1440 y 1920 px.';}for(const[group,entries]of Object.entries(choices))for(const[value,label]of entries){const b=document.createElement('button');b.dataset.group=group;b.dataset.value=value;b.textContent=label;b.onclick=()=>{if(group==='widths')width=value;else if(group==='scenarios')scenario=value;else position=value;paint()};document.getElementById(group).append(b)}paint();</script></html>
